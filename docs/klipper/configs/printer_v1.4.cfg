# =============================================================================
# Klipper Configuration - BTT SKR 3 EZ
# Printer: Cartesian Bed Slinger, 310x310 bed
# Extruder: BIQU H2 V2S Direct Drive
# Drivers: EZ2209 (UART)
# Probe: BLTouch
# Extras: Dual Z, Filament Runout Sensor, NeoPixel, Aux Fan, ADXL345
# =============================================================================
# Version: 1.4
# Changes: Switched Pico communication from UART (GP0/GP1) to USB.
#          Pico now connects to Pi via USB cable through panel-mount connectors.
#          Removed baud rate setting — not needed for USB.
#          Updated flash instructions to use USB communication interface.
#          Power for Pico now comes from Pi USB port — no separate power feed needed.
# =============================================================================
# NOTE: Review all pin assignments before first use. Cross-reference with
# your physical wiring and the BTT SKR 3 EZ pinout diagram.
# Pins marked with "# VERIFY" may differ depending on your specific wiring.
# =============================================================================


# =============================================================================
# MCU
# =============================================================================

[mcu]
# Run: ls /dev/serial/by-id  to find your board's serial ID after flashing
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_XXXXXXXXXXXXXXXXXXXX-if00

[mcu pico]
# Raspberry Pi Pico running Klipper as a secondary MCU.
# Hosts both ADXL345 sensors — one on SPI0 (toolhead), one on SPI1 (bed).
# Connected to Pi via USB through panel-mount USB-A (Pi side) and
# panel-mount micro-USB or USB-C (Pico side). USB carries both data and power —
# no separate power feed to the Pico enclosure required.
#
# Flash Klipper to the Pico:
#   cd ~/klipper && make menuconfig
#   Select:  Micro-controller: Raspberry Pi RP2040
#            Communication interface: USB
#   make
#   Copy klipper.uf2 to the Pico while in BOOTSEL mode
#
# After flashing, find the serial ID:
#   ls /dev/serial/by-id
# It will look like: usb-Klipper_rp2040_XXXXXXXXXXXXXXXXXXXX-if00
serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXXXXXXXXXXXXXX-if00


# =============================================================================
# KLIPPER SUPPORT SECTIONS
# =============================================================================
# Required for Mainsail/Fluidd and KlipperScreen functionality.

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]


# =============================================================================
# EXCLUDE OBJECT / ADAPTIVE MESHING
# =============================================================================
# Enables object cancellation in Mainsail/Fluidd and native adaptive meshing.
# Slicer must label objects — enable in PrusaSlicer/OrcaSlicer label objects setting.

[exclude_object]


# =============================================================================
# KAMP — Adaptive Purge Line & Smart Park
# =============================================================================
# Uses KAMP only for Line_Purge and Smart_Park. Adaptive meshing is handled
# natively by Klipper (ADAPTIVE=1 flag on BED_MESH_CALIBRATE).
#
# One-time install via SSH:
#   cd ~
#   git clone https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git
#   ln -s ~/Klipper-Adaptive-Meshing-Purging/Configuration printer_data/config/KAMP
#   cp ~/Klipper-Adaptive-Meshing-Purging/Configuration/KAMP_Settings.cfg ~/printer_data/config/KAMP_Settings.cfg
#
# Add to moonraker.conf for auto-updates:
#   [update_manager KAMP]
#   type: git_repo
#   channel: dev
#   path: ~/Klipper-Adaptive-Meshing-Purging
#   origin: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
#   managed_services: klipper
#   primary_branch: main

[include KAMP_Settings.cfg]
[include ./KAMP/Line_Purge.cfg]
[include ./KAMP/Smart_Park.cfg]


# =============================================================================
# PRINTER KINEMATICS
# =============================================================================

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0


# =============================================================================
# X AXIS
# =============================================================================

[stepper_x]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 310
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PD5
run_current: 0.800
stealthchop_threshold: 999999


# =============================================================================
# Y AXIS
# =============================================================================

[stepper_y]
step_pin: PA15
dir_pin: PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_max: 310
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PD0
run_current: 0.900       # Slightly higher for Y due to moving bed mass
stealthchop_threshold: 999999


# =============================================================================
# Z AXIS (Dual Motor)
# =============================================================================

[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PE0
microsteps: 16
rotation_distance: 8     # Standard T8 leadscrew — adjust if yours differs
endstop_pin: probe:z_virtual_endstop
position_min: -5         # Allows small negative movement for z-offset calibration
position_max: 350
homing_speed: 10
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PD11
dir_pin: PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 8     # Must match stepper_z exactly

[tmc2209 stepper_z1]
uart_pin: PD12
run_current: 0.800
stealthchop_threshold: 999999


# =============================================================================
# EXTRUDER - BIQU H2 V2S Direct Drive
# =============================================================================

[extruder]
step_pin: PD15
dir_pin: !PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 3.422    # H2 V2S specific — verify with extrusion calibration
gear_ratio: 7:1             # H2 V2S gear ratio
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3
sensor_type: EPCOS 100K B57560G104F  # VERIFY: adjust to your thermistor type
sensor_pin: PA2
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100
pressure_advance: 0.04      # Starting point — tune with PA tower after setup
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.700
stealthchop_threshold: 0   # Keep stealthchop OFF on extruder for best control


# =============================================================================
# HEATED BED
# =============================================================================

[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F  # VERIFY: adjust to your thermistor type
sensor_pin: PA1
min_temp: 0
max_temp: 130

[verify_heater heater_bed]
check_gain_time: 120        # Give the large bed time to heat


# =============================================================================
# FANS
# =============================================================================

# Primary part cooling fan (controlled by slicer fan speed)
[fan]
pin: PB7                    # VERIFY pin

# Hotend heatsink fan (always on when hotend is warm)
[heater_fan hotend_fan]
pin: PB6                    # VERIFY pin
heater: extruder
heater_temp: 50.0

# Auxiliary part cooling fan (manually controlled)
[fan_generic aux_fan]
pin: PB5                    # VERIFY pin


# =============================================================================
# BLTOUCH PROBE
# =============================================================================

[bltouch]
sensor_pin: ^PC13           # VERIFY pin
control_pin: PE5            # VERIFY pin
x_offset: -30              # MEASURE: physical X offset of probe from nozzle
y_offset: -10              # MEASURE: physical Y offset of probe from nozzle
z_offset: 0                # Calibrate with PROBE_CALIBRATE after setup
speed: 5
samples: 2
sample_retract_dist: 3.0
samples_result: median

[safe_z_home]
home_xy_position: 185, 165  # Center of bed adjusted for probe offset
speed: 80
z_hop: 10
z_hop_speed: 10


# =============================================================================
# BED MESH LEVELING
# =============================================================================

[bed_mesh]
speed: 120
horizontal_move_z: 8
mesh_min: 30, 30            # Accounts for probe offset from nozzle
mesh_max: 280, 300
probe_count: 5, 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0


# =============================================================================
# DUAL Z TILT ADJUST
# =============================================================================

[z_tilt]
# MEASURE: Set these to the actual X positions of your Z lead screws
z_positions:
    0, 155
    310, 155
# Points the probe will measure at (must be reachable with probe offset)
points:
    30, 155
    280, 155
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.02


# =============================================================================
# FILAMENT RUNOUT SENSOR
# =============================================================================

[filament_switch_sensor filament_sensor]
switch_pin: ^PC2            # VERIFY pin
pause_on_runout: True
runout_gcode:
    M117 Filament Runout!
    PAUSE
insert_gcode:
    M117 Filament Inserted
event_delay: 3.0
pause_delay: 0.5


# =============================================================================
# NEOPIXEL LED LIGHT BAR
# =============================================================================

[neopixel light_bar]
pin: PE6                    # VERIFY pin
chain_count: 20             # SET to the actual number of LEDs in your bar
color_order: GRB            # Most WS2812B strips are GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0


# =============================================================================
# ADXL345 — DUAL SENSOR SETUP (via Raspberry Pi Pico)
# =============================================================================
# Two ADXL345 sensors permanently mounted:
#   - Toolhead sensor: measures X-axis resonance (gantry/toolhead mass)
#   - Bed sensor:      measures Y-axis resonance (moving bed mass)
#
# This eliminates the need to manually swap a single sensor between axes.
# SHAPER_CALIBRATE will automatically use the correct sensor for each axis.
#
# WIRING — ADXL345 #1 (Toolhead) via Pico SPI0:
#   Pico 3.3V  →  ADXL VCC
#   Pico GND   →  ADXL GND
#   Pico GP2   →  ADXL SCL  (SPI0 SCLK)
#   Pico GP3   →  ADXL SDA  (SPI0 MOSI)
#   Pico GP4   →  ADXL SDO  (SPI0 MISO)
#   Pico GP5   →  ADXL CS   (Chip Select)
#
# WIRING — ADXL345 #2 (Bed) via Pico SPI1:
#   Pico 3.3V  →  ADXL VCC
#   Pico GND   →  ADXL GND
#   Pico GP10  →  ADXL SCL  (SPI1 SCLK)
#   Pico GP11  →  ADXL SDA  (SPI1 MOSI)
#   Pico GP12  →  ADXL SDO  (SPI1 MISO)
#   Pico GP13  →  ADXL CS   (Chip Select)
#
# MOUNTING:
#   Toolhead sensor: mount rigidly to printhead/carriage, flat against it
#   Bed sensor:      mount rigidly to bed frame/underside — NOT on the glass
#   Both should be as close to the moving mass center as practical.
#   axes_map may need adjustment depending on physical sensor orientation.

[adxl345 toolhead]
cs_pin: pico:GP5
spi_bus: spi0a               # GP2=SCLK, GP3=MOSI, GP4=MISO
axes_map: x, y, z            # Adjust if sensor is rotated on mount

[adxl345 bed]
cs_pin: pico:GP13
spi_bus: spi1a               # GP10=SCLK, GP11=MOSI, GP12=MISO
axes_map: x, y, z            # Adjust if sensor is rotated on mount

[resonance_tester]
accel_chip_x: adxl345 toolhead   # Toolhead sensor used for X axis testing
accel_chip_y: adxl345 bed        # Bed sensor used for Y axis testing
probe_points:
    155, 155, 20                  # Center of 310x310 bed

[input_shaper]
# Populated automatically after running SHAPER_CALIBRATE — do not edit manually.
# To calibrate:
#   TEST_RESONANCES AXIS=X
#   TEST_RESONANCES AXIS=Y
#   SHAPER_CALIBRATE
#   SAVE_CONFIG
# shaper_type_x: mzv
# shaper_freq_x: 0
# shaper_type_y: mzv
# shaper_freq_y: 0


# =============================================================================
# EMERGENCY STOP BUTTON
# =============================================================================
# Physical NC (normally-closed) momentary button wired to Z-STOP header (PC0).
# Z-STOP is free since BLTouch handles Z homing via probe:z_virtual_endstop.
#
# Wiring: Connect between Signal and GND pins on the Z-STOP header.
# NC is safer than NO — a broken/disconnected wire triggers a stop.
#
# To recover: click "Firmware Restart" in Mainsail/Fluidd, then re-home.

[gcode_button emergency_stop]
pin: ^!PC0          # ^ = pull-up resistor, ! = invert logic for NC button
press_gcode:
    EMERGENCY_STOP
release_gcode:

[gcode_macro EMERGENCY_STOP]
description: Triggered by physical emergency stop button on Z-STOP header
gcode:
    SET_LED LED=light_bar RED=1.0 GREEN=0.0 BLUE=0.0   # Red = fault
    M117 EMERGENCY STOP!
    TURN_OFF_HEATERS
    M84                                                  # Disable all motors
    {action_emergency_stop("Emergency stop button pressed")}


# =============================================================================
# MACROS
# =============================================================================

# --- LED Macros ---------------------------------------------------------------

[gcode_macro LIGHTS_ON]
description: Set LEDs to full white
gcode:
    SET_LED LED=light_bar RED=1.0 GREEN=1.0 BLUE=1.0

[gcode_macro LIGHTS_OFF]
description: Turn off LEDs
gcode:
    SET_LED LED=light_bar RED=0.0 GREEN=0.0 BLUE=0.0

[gcode_macro LIGHTS_PRINTING]
description: Set LEDs to warm work light tone
gcode:
    SET_LED LED=light_bar RED=1.0 GREEN=0.4 BLUE=0.0


# --- Fan Macros ---------------------------------------------------------------

[gcode_macro AUX_FAN_ON]
description: Turn auxiliary fan on full
gcode:
    SET_FAN_SPEED FAN=aux_fan SPEED=1.0

[gcode_macro AUX_FAN_OFF]
description: Turn auxiliary fan off
gcode:
    SET_FAN_SPEED FAN=aux_fan SPEED=0.0


# --- Filament Management ------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: Heat nozzle and load filament. Optional: TEMP=200
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M109 S{TEMP}
    M117 Loading filament...
    G91
    G1 E50 F300         # Feed into extruder
    G1 E30 F150         # Slow push through nozzle
    G90
    G92 E0
    M117 Load complete

[gcode_macro UNLOAD_FILAMENT]
description: Heat nozzle and retract filament. Optional: TEMP=200
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M109 S{TEMP}
    M117 Unloading filament...
    G91
    G1 E5 F300          # Small purge before retract
    G1 E-80 F600        # Fast retract out of hotend
    G90
    G92 E0
    M117 Unload complete

[gcode_macro M600]
description: Mid-print filament change. Parks toolhead and waits for RESUME.
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-5 F2700
    G1 Z{Z} F900
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state


# --- Preheat Presets ----------------------------------------------------------

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA (200C hotend / 60C bed)
gcode:
    M140 S60
    M104 S200
    M117 Preheating for PLA...

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG (235C hotend / 80C bed)
gcode:
    M140 S80
    M104 S235
    M117 Preheating for PETG...

[gcode_macro PREHEAT_ABS]
description: Preheat for ABS (245C hotend / 110C bed)
gcode:
    M140 S110
    M104 S245
    M117 Preheating for ABS...

[gcode_macro PREHEAT_TPU]
description: Preheat for TPU (230C hotend / 40C bed)
gcode:
    M140 S40
    M104 S230
    M117 Preheating for TPU...

[gcode_macro COOL_DOWN]
description: Turn off all heaters and fans
gcode:
    M140 S0
    M104 S0
    M107
    AUX_FAN_OFF
    M117 Cooling down...


# --- Toolhead Parking ---------------------------------------------------------

[gcode_macro PARK]
description: Park toolhead safely. Optional: X= Y= Z= to override position.
gcode:
    {% set X = params.X|default(5)|float %}
    {% set Y = params.Y|default(300)|float %}
    {% set Z_LIFT = params.Z|default(50)|float %}
    {% set cur_z = printer.toolhead.position.z %}
    G91
    G1 Z{[Z_LIFT, cur_z + 10]|max - cur_z} F3000
    G90
    G1 X{X} Y{Y} F6000
    M117 Parked


# --- Nozzle Cleaning ----------------------------------------------------------

[gcode_macro CLEAN_NOZZLE]
description: Wipe nozzle on silicone brush. ADJUST X/Y to your brush position.
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M109 S{TEMP}
    G90
    G1 X250 Y300 Z5 F6000   # Approach brush — ADJUST X/Y to your brush location
    G1 Z1 F1000
    G1 X200 F3000            # Wipe pass 1
    G1 X250 F3000            # Wipe pass 2
    G1 X200 F3000            # Wipe pass 3
    G1 Z5 F1000
    M117 Nozzle clean


# --- Utility ------------------------------------------------------------------

[gcode_macro HOME_IF_NEEDED]
description: Home all axes only if not already homed
gcode:
    {% if not printer.toolhead.homed_axes == "xyz" %}
        G28
    {% endif %}

[gcode_macro PRINT_STATS]
description: Display current print temperatures in LCD status
gcode:
    {% set hotend = printer.extruder.temperature|round(1) %}
    {% set bed = printer.heater_bed.temperature|round(1) %}
    M117 E:{hotend}C B:{bed}C


# --- Print Lifecycle ----------------------------------------------------------

[gcode_macro START_PRINT]
description: Start print routine — call from slicer with BED_TEMP= EXTRUDER_TEMP=
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}                  # Start bed heating (non-blocking)
    M104 S150                         # Pre-heat nozzle to safe temp (no ooze)
    M190 S{BED_TEMP}                  # Wait for bed to reach temp
    G28                               # Home all axes
    Z_TILT_ADJUST                     # Level dual Z
    BED_MESH_CALIBRATE ADAPTIVE=1     # Adaptive mesh — only probes print area
    SMART_PARK                        # KAMP: move near print start before heating
    M104 S{EXTRUDER_TEMP}             # Heat nozzle to print temp
    M109 S{EXTRUDER_TEMP}             # Wait for nozzle
    LIGHTS_PRINTING
    AUX_FAN_ON
    LINE_PURGE                        # KAMP: adaptive purge line near print
    M117 Printing...

[gcode_macro END_PRINT]
description: End print routine — call from slicer end gcode
gcode:
    M400                              # Wait for moves to finish
    G92 E0
    G1 E-5 F3600                      # Retract filament
    G91
    G1 Z10 F3000                      # Lift Z
    G90
    G1 X5 Y300 F5000                  # Present bed
    M104 S0                           # Heaters off
    M140 S0
    M107                              # Part fan off
    AUX_FAN_OFF
    M84                               # Motors off
    LIGHTS_ON                         # Full white so you can see finished print
    M117 Print Complete!

[gcode_macro PAUSE]
description: Pause the print
rename_existing: BASE_PAUSE
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(10)|float %}
    {% set E = params.E|default(1)|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z{Z} F900
    G90
    G1 X{X} Y{Y} F6000
    M117 Paused

[gcode_macro RESUME]
description: Resume the print
rename_existing: BASE_RESUME
gcode:
    {% set E = params.E|default(1)|float %}
    G91
    G1 E{E} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME
    M117 Printing...

[gcode_macro CANCEL_PRINT]
description: Cancel the print
rename_existing: BASE_CANCEL_PRINT
gcode:
    END_PRINT
    BASE_CANCEL_PRINT


# =============================================================================
# FIRST-TIME SETUP CHECKLIST (run these in order)
# =============================================================================
#
# 1. Verify all pins match your physical wiring
# 2. Power on — check for any Klipper errors in the web UI
# 3. Test each motor direction:
#       STEPPER_BUZZ STEPPER=stepper_x
#       STEPPER_BUZZ STEPPER=stepper_y
#       STEPPER_BUZZ STEPPER=stepper_z
#       STEPPER_BUZZ STEPPER=stepper_z1
#    Flip dir_pin polarity (add/remove !) if any move the wrong direction
# 4. Home X and Y only first:  G28 X Y
# 5. Manually position Z nozzle close to bed, then:  G28 Z
# 6. Run Z_TILT_ADJUST to level dual Z screws
# 7. Calibrate Z offset:  PROBE_CALIBRATE
# 8. Generate bed mesh:  BED_MESH_CALIBRATE
# 9. Calibrate extruder rotation_distance with a 100mm extrusion test
# 10. Tune Pressure Advance:  use the PA tower print method
# 11. Run input shaping:
#       TEST_RESONANCES AXIS=X
#       TEST_RESONANCES AXIS=Y
#       SHAPER_CALIBRATE
#     Then SAVE_CONFIG to store results
# 12. Flash Klipper to Pi Pico (see instructions in Pico MCU section above)
#     Verify with:  ls /dev/serial/by-id  (look for rp2040 entry)
# 13. Test both ADXL sensors respond:
#       ACCELEROMETER_QUERY CHIP=toolhead
#       ACCELEROMETER_QUERY CHIP=bed
# 14. Install KAMP (see instructions in KAMP section above)
# 15. Enable label objects in your slicer for adaptive meshing to work
#
# =============================================================================

# DO NOT EDIT BELOW — SAVE_CONFIG will append calibration data here
#*# <---------------------- SAVE CONFIG ---------------------->
