# =============================================================================
# Klipper Configuration - BTT SKR 3 EZ
# Version: 1.2
# Changes: Added popular macros (filament load/unload, preheat presets, park,
#          prime line, M600 filament change, print stats, auto full home,
#          screws tilt, cool down, nozzle clean) and KAMP adaptive meshing.
# Printer: Cartesian Bed Slinger, 310x310 bed
# Extruder: BIQU H2 V2S Direct Drive
# Drivers: EZ2209 (UART)
# Probe: BLTouch
# Extras: Dual Z, Filament Runout Sensor, NeoPixel Light Bar, Aux Fan, ADXL345
# Display: KlipperScreen on 3.5" Pi touchscreen
# =============================================================================
# IMPORTANT NOTES:
# - Board chip is STM32H723 (NOT H743 as labeled on some units)
# - Katapult bootloader is installed — use flashtool.py for future updates
# - ADXL345 is wired to Pi GPIO (not SKR 3 EZ) to avoid SPI pin conflict
# - Mini12864 display removed from config (hardware issue, not in use)
# - Pins marked "# VERIFY" need confirmation against your physical wiring
# =============================================================================


# =============================================================================
# MCU - BTT SKR 3 EZ (STM32H723)
# =============================================================================
# Flashed via Katapult bootloader. To update firmware in future:
#   1. Double-tap reset button to enter Katapult mode
#   2. python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_stm32h723xx_3C002F001651313238353730-if00

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_3C002F001651313238353730-if00


# =============================================================================
# RASPBERRY PI - SECONDARY MCU
# =============================================================================
# Required for Pi-hosted ADXL345 and KlipperScreen support.
#
# One-time setup (already completed):
#   cd ~/klipper && make menuconfig  (select "Linux process")
#   make clean && make
#   sudo cp out/klipper.elf /usr/local/bin/klipper_mcu
#   sudo chmod +x /usr/local/bin/klipper_mcu
#   sudo cp scripts/klipper-mcu.service /etc/systemd/system/
#   sudo systemctl enable klipper-mcu
#   sudo systemctl start klipper-mcu
#   SPI enabled via: sudo raspi-config → Interface Options → SPI → Enable

[mcu rpi]
serial: /tmp/klipper_host_mcu


# =============================================================================
# PRINTER KINEMATICS
# =============================================================================

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0


# =============================================================================
# X AXIS
# =============================================================================

[stepper_x]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 310
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PD5
run_current: 0.800
stealthchop_threshold: 999999


# =============================================================================
# Y AXIS
# =============================================================================

[stepper_y]
step_pin: PA15
dir_pin: PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_max: 310
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PD0
run_current: 0.900          # Slightly higher for Y due to moving bed mass
stealthchop_threshold: 999999


# =============================================================================
# Z AXIS (Dual Motor)
# =============================================================================

[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PE0
microsteps: 16
rotation_distance: 8        # Standard T8 leadscrew — adjust if yours differs
endstop_pin: probe:z_virtual_endstop
position_min: -5            # Allows small negative movement for z-offset calibration
position_max: 350
homing_speed: 10
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PD11
dir_pin: PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 8        # Must match stepper_z exactly

[tmc2209 stepper_z1]
uart_pin: PD12
run_current: 0.800
stealthchop_threshold: 999999


# =============================================================================
# EXTRUDER - BIQU H2 V2S Direct Drive
# =============================================================================

[extruder]
step_pin: PD15
dir_pin: !PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 3.422    # H2 V2S specific — verify with extrusion calibration
gear_ratio: 7:1             # H2 V2S gear ratio
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3
sensor_type: EPCOS 100K B57560G104F  # VERIFY: adjust to your thermistor type
sensor_pin: PA2
min_temp: -100              # TEMPORARY — revert to 0 before first print!
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100
control: watermark          # TEMPORARY — replace with PID values after tuning
pressure_advance: 0.04      # Starting point — tune with PA tower after setup
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.700
stealthchop_threshold: 0    # Keep stealthchop OFF on extruder for best control


# =============================================================================
# HEATED BED
# =============================================================================

[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F  # VERIFY: adjust to your thermistor type
sensor_pin: PA1
min_temp: -100              # TEMPORARY — revert to 0 before first print!
max_temp: 130
control: watermark          # TEMPORARY — replace with PID values after tuning

[verify_heater heater_bed]
check_gain_time: 120        # Give the large bed time to heat


# =============================================================================
# FANS
# =============================================================================

# Primary part cooling fan (controlled by slicer fan speed)
[fan]
pin: PB7                    # VERIFY pin

# Hotend heatsink fan (always on when hotend is warm)
[heater_fan hotend_fan]
pin: PB6                    # VERIFY pin
heater: extruder
heater_temp: 50.0

# Auxiliary part cooling fan (manually controlled)
[fan_generic aux_fan]
pin: PB5                    # VERIFY pin


# =============================================================================
# BLTOUCH PROBE
# =============================================================================

[bltouch]
sensor_pin: ^PC13           # VERIFY pin
control_pin: PE5            # VERIFY pin
x_offset: -30               # MEASURE: physical X offset of probe from nozzle
y_offset: -10               # MEASURE: physical Y offset of probe from nozzle
z_offset: 0                 # Calibrate with PROBE_CALIBRATE after setup
speed: 5
samples: 2
sample_retract_dist: 3.0
samples_result: median

[safe_z_home]
home_xy_position: 185, 165  # Center of bed adjusted for probe offset
speed: 80
z_hop: 10
z_hop_speed: 10


# =============================================================================
# BED MESH LEVELING
# =============================================================================

[bed_mesh]
speed: 120
horizontal_move_z: 8
mesh_min: 30, 30            # Accounts for probe offset from nozzle
mesh_max: 280, 300
probe_count: 5, 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0


# =============================================================================
# DUAL Z TILT ADJUST
# =============================================================================

[z_tilt]
# MEASURE: Set these to the actual X positions of your Z lead screws
z_positions:
    0, 155
    310, 155
# Points the probe will measure at (must be reachable with probe offset)
points:
    30, 155
    280, 155
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.02


# =============================================================================
# FILAMENT RUNOUT SENSOR
# =============================================================================

[filament_switch_sensor filament_sensor]
switch_pin: ^PC2            # VERIFY pin
pause_on_runout: True
runout_gcode:
    M117 Filament Runout!
    PAUSE
insert_gcode:
    M117 Filament Inserted
event_delay: 3.0
pause_delay: 0.5


# =============================================================================
# NEOPIXEL LED LIGHT BAR
# =============================================================================

[neopixel light_bar]
pin: PE6                    # VERIFY pin
chain_count: 20             # SET to the actual number of LEDs in your bar
color_order: GRB            # Most WS2812B strips are GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0


# =============================================================================
# ADXL345 - INPUT SHAPER / RESONANCE TESTING
# =============================================================================
# Wired directly to Raspberry Pi GPIO to avoid SPI pin conflict with EXP headers.
#
# Pi GPIO wiring:
#   ADXL345 VCC  → Pi Pin 1  (3.3V)
#   ADXL345 GND  → Pi Pin 6  (GND)
#   ADXL345 CS   → Pi Pin 24 (GPIO8  / SPI CE0)
#   ADXL345 SCLK → Pi Pin 23 (GPIO11 / SPI CLK)
#   ADXL345 MOSI → Pi Pin 19 (GPIO10 / SPI MOSI)
#   ADXL345 MISO → Pi Pin 21 (GPIO9  / SPI MISO)
#
# To run input shaping after printer is assembled:
#   TEST_RESONANCES AXIS=X
#   TEST_RESONANCES AXIS=Y
#   SHAPER_CALIBRATE
#   SAVE_CONFIG
# =============================================================================

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0

[resonance_tester]
accel_chip: adxl345
probe_points:
    155, 155, 20            # Center of 310x310 bed

[input_shaper]
# Populated automatically after running SHAPER_CALIBRATE
# shaper_type_x: mzv
# shaper_freq_x: 0
# shaper_type_y: mzv
# shaper_freq_y: 0


# =============================================================================
# KLIPPERSCREEN - 3.5" Pi Touchscreen
# =============================================================================
# KlipperScreen is installed and running on the Pi touchscreen.
# These sections are required for KlipperScreen functionality.

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]


# =============================================================================
# EXCLUDE OBJECT / ADAPTIVE MESHING
# =============================================================================
# Required for native Klipper adaptive meshing (v0.12+) and KAMP purge features.
# Also enables object cancellation from Mainsail/Fluidd during a print.
#
# Slicer setup required — enable "Label Objects" in your slicer:
#   OrcaSlicer:   Print Settings → Others → Label Objects + Exclude Objects
#   PrusaSlicer:  Printer Settings → Firmware → G-code flavor: Klipper
#                 Print Settings → Output options → Label objects: Firmware-specific
#   SuperSlicer:  Same as PrusaSlicer
#
# Also add to moonraker.conf under [file_manager]:
#   enable_object_processing: True

[exclude_object]


# =============================================================================
# FIRMWARE RETRACTION
# =============================================================================
# Enables G10/G11 retraction commands and allows KAMP to use correct retraction
# settings for purge lines. Tune these values after first prints.

[firmware_retraction]
retract_length: 0.8         # mm to retract — good starting point for direct drive
retract_speed: 40           # mm/s retraction speed
unretract_extra_length: 0   # additional filament on unretract — usually 0
unretract_speed: 30         # mm/s unretract speed


# =============================================================================
# KAMP - Klipper Adaptive Meshing & Purging
# =============================================================================
# KAMP provides adaptive purge lines and Smart Park features.
# Native Klipper adaptive meshing (ADAPTIVE=1) is used instead of KAMP meshing.
#
# One-time install (run via SSH):
#   cd ~
#   git clone https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git
#   ln -s ~/Klipper-Adaptive-Meshing-Purging/Configuration printer_data/config/KAMP
#   cp ~/Klipper-Adaptive-Meshing-Purging/Configuration/KAMP_Settings.cfg ~/printer_data/config/KAMP_Settings.cfg
#
# Add to moonraker.conf for auto-updates:
#   [update_manager KAMP]
#   type: git_repo
#   channel: dev
#   path: ~/Klipper-Adaptive-Meshing-Purging
#   origin: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
#   managed_services: klipper
#   primary_branch: main

[include KAMP_Settings.cfg]
[include ./KAMP/Line_Purge.cfg]
[include ./KAMP/Smart_Park.cfg]


# =============================================================================
# MACROS
# =============================================================================

# --- LED: Basic Presets ------------------------------------------------------

[gcode_macro LIGHTS_ON]
description: Set LEDs to full white
gcode:
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED=1.0 GREEN=1.0 BLUE=1.0

[gcode_macro LIGHTS_OFF]
description: Turn off LEDs
gcode:
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED=0.0 GREEN=0.0 BLUE=0.0

[gcode_macro LIGHTS_PRINTING]
description: Set LEDs to warm work light tone
gcode:
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED=1.0 GREEN=0.4 BLUE=0.0

[gcode_macro LIGHTS_RED]
description: Set LEDs to red
gcode:
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED=1.0 GREEN=0.0 BLUE=0.0

[gcode_macro LIGHTS_GREEN]
description: Set LEDs to green
gcode:
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED=0.0 GREEN=1.0 BLUE=0.0

[gcode_macro LIGHTS_BLUE]
description: Set LEDs to blue
gcode:
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED=0.0 GREEN=0.0 BLUE=1.0

[gcode_macro LIGHTS_PURPLE]
description: Set LEDs to purple
gcode:
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED=0.5 GREEN=0.0 BLUE=1.0

[gcode_macro LIGHTS_CUSTOM]
description: Set LEDs to a custom color — call with R=, G=, B= params (0.0-1.0)
gcode:
    {% set R = params.R|default(1.0)|float %}
    {% set G = params.G|default(1.0)|float %}
    {% set B = params.B|default(1.0)|float %}
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED={R} GREEN={G} BLUE={B}


# --- LED: Rainbow Cycle -------------------------------------------------------
# Usage: LIGHTS_RAINBOW_START  /  LIGHTS_RAINBOW_STOP
# Cycles through 6 colors using a self-rescheduling delayed_gcode loop.
# Adjust DURATION in rainbow_loop to change speed (default 0.5s per step).

[gcode_macro LIGHTS_RAINBOW_START]
description: Start rainbow cycle on LED bar
gcode:
    SET_GCODE_VARIABLE MACRO=RAINBOW_CYCLE VARIABLE=running VALUE=1
    SET_GCODE_VARIABLE MACRO=RAINBOW_CYCLE VARIABLE=step VALUE=0
    UPDATE_DELAYED_GCODE ID=rainbow_loop DURATION=0.1

[gcode_macro LIGHTS_RAINBOW_STOP]
description: Stop rainbow cycle
gcode:
    SET_GCODE_VARIABLE MACRO=RAINBOW_CYCLE VARIABLE=running VALUE=0
    UPDATE_DELAYED_GCODE ID=rainbow_loop DURATION=0

[gcode_macro RAINBOW_CYCLE]
description: Internal rainbow state machine — do not call directly
variable_running: 0
variable_step: 0
gcode:
    {% if running %}
        {% set s = step % 6 %}
        {% if s == 0 %}
            SET_LED LED=light_bar RED=1.0 GREEN=0.0 BLUE=0.0
        {% elif s == 1 %}
            SET_LED LED=light_bar RED=1.0 GREEN=0.5 BLUE=0.0
        {% elif s == 2 %}
            SET_LED LED=light_bar RED=1.0 GREEN=1.0 BLUE=0.0
        {% elif s == 3 %}
            SET_LED LED=light_bar RED=0.0 GREEN=1.0 BLUE=0.0
        {% elif s == 4 %}
            SET_LED LED=light_bar RED=0.0 GREEN=0.0 BLUE=1.0
        {% else %}
            SET_LED LED=light_bar RED=0.5 GREEN=0.0 BLUE=1.0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=RAINBOW_CYCLE VARIABLE=step VALUE={(step + 1) % 6}
        UPDATE_DELAYED_GCODE ID=rainbow_loop DURATION=0.5
    {% endif %}

[delayed_gcode rainbow_loop]
gcode:
    RAINBOW_CYCLE


# --- LED: Temperature Tracking ------------------------------------------------
# Usage: LIGHTS_TEMP_TRACKING_START  /  LIGHTS_TEMP_TRACKING_STOP
# LEDs shift from blue (cold) → purple → red (at temp).
# Turns green when hotend is within 5°C of target.
# Updates every 2 seconds while active.

[gcode_macro LIGHTS_TEMP_TRACKING_START]
description: Start temperature tracking on LEDs — blue=cold, red=hot, green=ready
gcode:
    SET_GCODE_VARIABLE MACRO=TEMP_TRACKING VARIABLE=running VALUE=1
    UPDATE_DELAYED_GCODE ID=temp_tracking_loop DURATION=1

[gcode_macro LIGHTS_TEMP_TRACKING_STOP]
description: Stop temperature tracking
gcode:
    SET_GCODE_VARIABLE MACRO=TEMP_TRACKING VARIABLE=running VALUE=0
    UPDATE_DELAYED_GCODE ID=temp_tracking_loop DURATION=0

[gcode_macro TEMP_TRACKING]
description: Internal temp tracking state — do not call directly
variable_running: 0
gcode:
    {% if running %}
        {% set hotend_actual = printer.extruder.temperature %}
        {% set hotend_target = printer.extruder.target %}

        {% if hotend_target > 0 %}
            {% set progress = [hotend_actual / hotend_target, 1.0]|min %}
        {% else %}
            {% set progress = 0.0 %}
        {% endif %}

        # Green when within 5°C of target, otherwise blue→purple→red
        {% if hotend_target > 0 and hotend_actual >= hotend_target - 5 %}
            SET_LED LED=light_bar RED=0.0 GREEN=1.0 BLUE=0.0
        {% else %}
            SET_LED LED=light_bar RED={progress} GREEN=0.0 BLUE={1.0 - progress}
        {% endif %}

        UPDATE_DELAYED_GCODE ID=temp_tracking_loop DURATION=2
    {% endif %}

[delayed_gcode temp_tracking_loop]
gcode:
    TEMP_TRACKING


# --- Emergency Stop Button ----------------------------------------------------
# Wired to Z-STOP header (PC0) — completely free since BLTouch is used for Z.
#
# Wiring:
#   Use a normally-closed (NC) momentary button.
#   Connect between Signal and GND pins on the Z-STOP header.
#   NC is safer than NO — a broken wire triggers a stop rather than being ignored.
#
# To reset after emergency stop:
#   Click "Firmware Restart" in Mainsail/Fluidd, then re-home the printer.

[gcode_button emergency_stop]
pin: ^!PC0          # ^ enables pull-up resistor, ! inverts logic for NC button
press_gcode:
    EMERGENCY_STOP
release_gcode:

[gcode_macro EMERGENCY_STOP]
description: Triggered by physical emergency stop button on Z-STOP header
gcode:
    LIGHTS_RAINBOW_STOP
    LIGHTS_TEMP_TRACKING_STOP
    SET_LED LED=light_bar RED=1.0 GREEN=0.0 BLUE=0.0   # Red to indicate fault
    M117 EMERGENCY STOP!
    TURN_OFF_HEATERS
    M84                                                  # Disable all motors
    {action_emergency_stop("Emergency stop button pressed")}


# --- Fan Macros ---------------------------------------------------------------

[gcode_macro AUX_FAN_ON]
description: Turn auxiliary fan on full
gcode:
    SET_FAN_SPEED FAN=aux_fan SPEED=1.0

[gcode_macro AUX_FAN_OFF]
description: Turn auxiliary fan off
gcode:
    SET_FAN_SPEED FAN=aux_fan SPEED=0.0


# --- Filament Management ------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: Heat nozzle and load filament — call with TEMP= for non-PLA
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M109 S{TEMP}
    M117 Loading filament...
    G91
    G1 E50 F300         # Feed into extruder
    G1 E30 F150         # Slow push through nozzle
    G90
    G92 E0
    M117 Load complete

[gcode_macro UNLOAD_FILAMENT]
description: Heat nozzle and unload filament — call with TEMP= for non-PLA
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M109 S{TEMP}
    M117 Unloading filament...
    G91
    G1 E5 F300          # Small push before retract
    G1 E-80 F600        # Fast retract out of hotend
    G90
    G92 E0
    M117 Unload complete

[gcode_macro M600]
description: Filament change mid-print — triggered by slicer color change or manually
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-5 F2700
    G1 Z{Z} F900
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state


# --- Preheat Presets ----------------------------------------------------------

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA (200°C hotend / 60°C bed)
gcode:
    M140 S60
    M104 S200
    M117 Preheating for PLA...

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG (235°C hotend / 80°C bed)
gcode:
    M140 S80
    M104 S235
    M117 Preheating for PETG...

[gcode_macro PREHEAT_ABS]
description: Preheat for ABS (245°C hotend / 110°C bed)
gcode:
    M140 S110
    M104 S245
    M117 Preheating for ABS...

[gcode_macro PREHEAT_TPU]
description: Preheat for TPU (230°C hotend / 40°C bed)
gcode:
    M140 S40
    M104 S230
    M117 Preheating for TPU...

[gcode_macro COOL_DOWN]
description: Turn off all heaters and fans
gcode:
    M140 S0
    M104 S0
    M107
    M117 Cooling down...


# --- Toolhead Parking ---------------------------------------------------------

[gcode_macro PARK]
description: Park toolhead at a safe position — call with X= Y= Z= to override
gcode:
    {% set X = params.X|default(5)|float %}
    {% set Y = params.Y|default(300)|float %}
    {% set Z = params.Z|default(50)|float %}
    {% set current_z = printer.toolhead.position.z %}
    G91
    G1 Z{[Z, current_z + 10]|max} F3000
    G90
    G1 X{X} Y{Y} F6000
    M117 Parked


# --- Nozzle Cleaning ----------------------------------------------------------

[gcode_macro CLEAN_NOZZLE]
description: Wipe nozzle on brush — ADJUST coordinates to match your brush position
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M109 S{TEMP}
    G90
    G1 X250 Y300 Z5 F6000   # Move to brush — ADJUST X/Y to your brush location
    G1 Z1 F1000
    G1 X200 F3000            # Wipe pass 1
    G1 X250 F3000            # Wipe pass 2
    G1 X200 F3000            # Wipe pass 3
    G1 X250 F3000            # Wipe pass 4
    G1 Z10 F3000
    M117 Nozzle cleaned


# --- Calibration Helpers ------------------------------------------------------

[gcode_macro AUTO_FULL_HOME]
description: Full home and dual Z level sequence
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z
    M117 Homing complete

[gcode_macro LEVEL_BED]
description: Run bed screw tilt adjust assistant (requires [screws_tilt_adjust])
gcode:
    G28
    SCREWS_TILT_CALCULATE

[gcode_macro PRINT_STATS]
description: Display current printer temps and position in console
gcode:
    {% set hotend = printer.extruder.temperature %}
    {% set hotend_target = printer.extruder.target %}
    {% set bed = printer.heater_bed.temperature %}
    {% set bed_target = printer.heater_bed.target %}
    {% set pos = printer.toolhead.position %}
    { action_respond_info(
        "Hotend: %.1f / %.1f C\n"
        "Bed:    %.1f / %.1f C\n"
        "X: %.2f  Y: %.2f  Z: %.2f"
        % (hotend, hotend_target, bed, bed_target, pos.x, pos.y, pos.z)
    ) }


# --- Print Lifecycle Macros ---------------------------------------------------

[gcode_macro START_PRINT]
description: Start print routine — call from slicer with START_PRINT BED_TEMP=60 EXTRUDER_TEMP=200
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    LIGHTS_RAINBOW_STOP               # Stop rainbow if running from idle
    LIGHTS_TEMP_TRACKING_START        # Show heat-up progress on LEDs
    M140 S{BED_TEMP}                  # Start bed heating (non-blocking)
    M104 S150                         # Pre-heat nozzle to safe temp (no ooze)
    M190 S{BED_TEMP}                  # Wait for bed to reach temp
    G28                               # Home all axes
    Z_TILT_ADJUST                     # Level dual Z
    BED_MESH_CALIBRATE ADAPTIVE=1     # Adaptive mesh — only meshes print area
    SMART_PARK                        # Park near print area for final heat
    M104 S{EXTRUDER_TEMP}             # Heat nozzle to print temp
    M109 S{EXTRUDER_TEMP}             # Wait for nozzle
    LIGHTS_TEMP_TRACKING_STOP         # Stop tracking — now at temp
    LIGHTS_PRINTING                   # Switch to warm work light
    AUX_FAN_ON
    LINE_PURGE                        # KAMP adaptive purge line near print area
    M117 Printing...

[gcode_macro END_PRINT]
description: End print routine — call from slicer end gcode
gcode:
    M400                              # Wait for moves to finish
    G92 E0
    G1 E-5 F3600                      # Retract filament
    G91
    G1 Z10 F3000                      # Lift Z
    G90
    G1 X5 Y300 F5000                  # Present bed
    M104 S0                           # Heaters off
    M140 S0
    M107                              # Part fan off
    AUX_FAN_OFF
    M84                               # Motors off
    LIGHTS_ON                         # Full white so you can see finished print
    LIGHTS_RAINBOW_START              # Celebrate with rainbow when done!
    M117 Print Complete!

[gcode_macro PAUSE]
description: Pause the print
rename_existing: BASE_PAUSE
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(10)|float %}
    {% set E = params.E|default(1)|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z{Z} F900
    G90
    G1 X{X} Y{Y} F6000
    M117 Paused

[gcode_macro RESUME]
description: Resume the print
rename_existing: BASE_RESUME
gcode:
    {% set E = params.E|default(1)|float %}
    G91
    G1 E{E} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME
    M117 Printing...

[gcode_macro CANCEL_PRINT]
description: Cancel the print
rename_existing: BASE_CANCEL_PRINT
gcode:
    END_PRINT
    BASE_CANCEL_PRINT


